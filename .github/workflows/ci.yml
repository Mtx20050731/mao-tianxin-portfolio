name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resources, originals and entry size
        run: python3 scripts/validate-site.py
      - name: Check deployment script syntax
        run: bash -n scripts/deploy-portfolio.sh
